name: AirCard-iOS
options:
  bundleIdPrefix: com.mak5er
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "7"
    TARGETED_DEVICE_FAMILY: "1"
    # AirliftFFI is arm64-only (aws-lc-rs / idevice); drop x86_64 simulator slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  AirCard-iOS:
    type: application
    platform: iOS
    sources:
      - path: ios-app
    resources:
      - path: ios-app/zh-Hans.lproj
    dependencies:
      - framework: AirliftFFI.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - target: AirCard-LocalDevVPN
    settings:
      base:
        PRODUCT_NAME: "AirCard-iOS"
        PRODUCT_BUNDLE_IDENTIFIER: com.mutually.wallpaper
        INFOPLIST_FILE: ios-app/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios-app/AirCard-iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # idevice's static lib pulls in C++ symbols (aws-lc); link libc++.
        OTHER_LDFLAGS: "-lc++ -framework Security"
        GENERATE_INFOPLIST_FILE: NO

  AirCard-LocalDevVPN:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: vpn-extension
    dependencies:
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_NAME: "AirCard-LocalDevVPN"
        PRODUCT_BUNDLE_IDENTIFIER: com.mutually.wallpaper.LocalDevVPN
        INFOPLIST_FILE: vpn-extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: vpn-extension/AirCardLocalDevVPN.entitlements
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
